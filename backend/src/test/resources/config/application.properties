# Test-only overrides (loaded on top of src/main/resources/application.properties).
# Each Spring context gets its own in-memory H2 database, so tests never touch a real PostgreSQL.
spring.datasource.url=jdbc:h2:mem:sentinelcore-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,TIMESTAMP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test fixture signing key (not used anywhere outside the test suite)
jwt.secret=test-fixture-signing-key-not-a-secret-0123456789abcdef

app.bootstrap.demo-users-enabled=false
app.cloud.aws.enabled=false
app.cloud.remediation.execution-enabled=false
