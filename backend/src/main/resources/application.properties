spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinelcore_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is managed by Hibernate (additive updates only). See docs/security-audit.md for the
# migration plan and the DDL of the tables added for cloud security.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
# Never include stack traces or exception messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# JWT: set JWT_SECRET (>= 32 bytes) in every non-local environment. When unset, an ephemeral
# per-process key is generated and all sessions are invalidated on restart.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:sentinelcore}
jwt.audience=${JWT_AUDIENCE:sentinelcore-api}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}

# Authentication hardening
app.auth.self-registration-enabled=${APP_SELF_REGISTRATION_ENABLED:false}
app.security.login.max-attempts=${APP_LOGIN_MAX_ATTEMPTS:5}
app.security.login.lock-minutes=${APP_LOGIN_LOCK_MINUTES:15}

# Account bootstrap (see AdminInitializer). Demo accounts use well-known passwords: local development only.
app.bootstrap.demo-users-enabled=${APP_DEMO_USERS_ENABLED:false}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}

# Cloud integration. Disabled by default: no provider API is called until explicitly enabled.
app.cloud.aws.enabled=${APP_CLOUD_AWS_ENABLED:false}
app.cloud.aws.default-region=${APP_CLOUD_AWS_DEFAULT_REGION:us-east-1}
app.cloud.aws.api-call-timeout-seconds=${APP_CLOUD_AWS_API_CALL_TIMEOUT_SECONDS:30}
app.cloud.aws.api-call-attempt-timeout-seconds=${APP_CLOUD_AWS_API_CALL_ATTEMPT_TIMEOUT_SECONDS:10}
app.cloud.aws.assume-role-session-seconds=${APP_CLOUD_AWS_ASSUME_ROLE_SESSION_SECONDS:900}
# Remediation execution against real cloud resources is a separate, explicit opt-in.
app.cloud.remediation.execution-enabled=${APP_CLOUD_REMEDIATION_EXECUTION_ENABLED:false}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
